name: Event evidence checks
on:
  push:
    branches: [main]
    paths:
      - 'backend/event_news_preview.py'
      - 'backend/event_feed_sources.py'
      - 'backend/test_event_news_preview.py'
      - 'backend/test_event_feed_sources.py'
      - 'src/EventScenarios.jsx'
      - '.github/workflows/event-evidence.yml'
  pull_request:
    paths:
      - 'backend/event_news_preview.py'
      - 'backend/test_event_news_preview.py'
      - 'src/EventScenarios.jsx'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated event research tests
        run: |
          python -m unittest discover -s backend -p 'test_event_news_preview.py' -v
          python -m unittest discover -s backend -p 'test_event_feed_sources.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
